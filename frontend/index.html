<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sword.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0a1e" />
    <title>Life RPG — Turn Your Life Into a Quest Log</title>
    <meta
      name="description"
      content="Life RPG turns real tasks into quests. Earn XP, level up, build streaks, and gear up your character."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Theme bootstrap: apply the persisted theme BEFORE first paint so
      // there is never a light/dark flash on load. Mirrors useTheme.js.
      (function () {
        try {
          var t = localStorage.getItem('liferpg-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* storage unavailable — default dark stays */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
